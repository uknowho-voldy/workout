<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vikku — Workout Plan</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; min-height: 100vh; }

header { background: #1F3864; color: white; padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.header-left h1 { font-size: 18px; font-weight: 600; }
.header-left p { font-size: 11px; opacity: 0.65; margin-top: 2px; }
.header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.sync-dot { font-size: 10px; padding: 3px 8px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); color: white; opacity: 0.8; white-space: nowrap; }
.sync-dot.saving { background: rgba(255,255,255,0.2); }
.sync-dot.saved { background: #1D9E75; border-color: #1D9E75; opacity: 1; }
.sync-dot.error { background: #E24B4A; border-color: #E24B4A; opacity: 1; }
.session-timer { font-size: 11px; color: rgba(255,255,255,0.75); display: none; }
.session-timer.active { display: block; }

.page { padding: 1rem; max-width: 680px; margin: 0 auto; }

.section-label { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.08em; margin: 1.25rem 0 0.5rem; }
.card { background: white; border-radius: 12px; border: 0.5px solid #e5e5e5; padding: 1rem 1.25rem; margin-bottom: 10px; }

/* Tracker */
.set-block { background: #f9f9f7; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
.set-block-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.sbt { font-size: 13px; font-weight: 600; color: #1a1a1a; }
.sbs { font-size: 11px; color: #888; margin-bottom: 4px; }
.last-session { font-size: 11px; color: #1D9E75; margin-bottom: 8px; font-style: italic; }
.last-session.loading { color: #aaa; }
.last-session.none { color: #bbb; }

.ex-variant-select { font-size: 12px; border: 0.5px solid #ddd; border-radius: 6px; padding: 4px 6px; color: #555; background: white; margin-bottom: 8px; width: 100%; }

.set-row { display: flex; align-items: center; gap: 5px; padding: 6px 8px; border: 1.5px solid #e0e0e0; border-radius: 8px; margin-bottom: 5px; background: white; transition: all 0.15s; }
.set-row:last-of-type { margin-bottom: 0; }
.set-row.done { border-color: #1D9E75; background: #E1F5EE; }
.set-row.warmup-row { border-style: dashed; border-color: #ccc; background: #fafaf8; }
.set-num { font-size: 11px; font-weight: 600; color: #888; min-width: 44px; }
.set-row.done .set-num { color: #0F6E56; }
.set-row.warmup-row .set-num { color: #bbb; }
.set-wi { width: 58px; border: 0.5px solid #ddd; border-radius: 6px; padding: 5px 3px; font-size: 14px; font-weight: 600; text-align: center; background: white; }
.set-row.done .set-wi { border-color: #9FE1CB; background: transparent; }
.set-unit { font-size: 10px; color: #aaa; white-space: nowrap; }
.set-x { font-size: 12px; color: #ccc; }
.set-ri { width: 50px; border: 0.5px solid #ddd; border-radius: 6px; padding: 5px 3px; font-size: 14px; font-weight: 600; text-align: center; background: white; }
.set-row.done .set-ri { border-color: #9FE1CB; background: transparent; }
.set-tgt { font-size: 10px; color: #bbb; flex: 1; text-align: center; }
.set-check { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid #ddd; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; color: #ccc; flex-shrink: 0; transition: all 0.15s; user-select: none; }
.set-row.done .set-check { background: #1D9E75; border-color: #1D9E75; color: white; }
.quick-fill-btn { font-size: 10px; color: #378ADD; background: none; border: none; cursor: pointer; padding: 0; white-space: nowrap; display: none; }
.quick-fill-btn.visible { display: inline; }
.add-warmup-btn { font-size: 11px; color: #888; background: none; border: none; cursor: pointer; padding: 4px 0 6px; display: block; }
.add-warmup-btn:hover { color: #555; }

.ex-note-input { width: 100%; border: 0.5px solid #e0e0e0; border-radius: 6px; padding: 6px 8px; font-size: 12px; color: #555; background: #fafaf8; resize: none; font-family: inherit; min-height: 38px; margin-top: 8px; font-style: italic; }
.ex-note-input::placeholder { color: #bbb; }

/* Rest timer overlay */
.rest-timer-overlay { display: none; position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #1F3864; color: white; border-radius: 16px; padding: 14px 24px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.25); z-index: 100; min-width: 200px; }
.rest-timer-overlay.active { display: block; }
.rest-timer-label { font-size: 11px; opacity: 0.7; margin-bottom: 4px; }
.rest-timer-count { font-size: 36px; font-weight: 700; letter-spacing: -1px; }
.rest-timer-count.urgent { color: #E24B4A; }
.rest-timer-bar { height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.rest-timer-progress { height: 4px; background: #1D9E75; border-radius: 2px; transition: width 1s linear; }
.rest-timer-skip { font-size: 11px; opacity: 0.6; margin-top: 8px; cursor: pointer; background: none; border: none; color: white; display: block; width: 100%; text-align: center; }

.notes-area { width: 100%; border: 0.5px solid #ddd; border-radius: 8px; padding: 10px; font-size: 13px; min-height: 60px; resize: vertical; font-family: inherit; background: white; }
.notes-label { display: flex; align-items: baseline; gap: 6px; }
.notes-optional { font-size: 10px; color: #aaa; font-weight: 400; }
.save-btn { width: 100%; margin-top: 12px; padding: 13px; background: #1F3864; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.save-btn:active { opacity: 0.85; }
.save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.tracker-daylabel { flex: 1; border: 0.5px solid #ddd; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 600; color: #0F6E56; background: #E1F5EE; display: flex; align-items: center; justify-content: center; }

.he { background: white; border-radius: 10px; border: 0.5px solid #e5e5e5; padding: 12px 14px; margin-bottom: 8px; }
.hh { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.ht { font-size: 14px; font-weight: 600; }
.hd { font-size: 12px; color: #888; }
.hl { font-size: 12px; color: #555; line-height: 1.8; }
.hn { font-size: 12px; color: #888; margin-top: 6px; font-style: italic; border-top: 0.5px solid #f0f0f0; padding-top: 6px; }

.timer-btn { font-size: 10px; color: #1F3864; background: none; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; padding: 4px 8px; white-space: nowrap; flex-shrink: 0; font-family: inherit; }
.timer-btn.timer-running { background: #1F3864; color: white; border-color: #1F3864; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Vikku — Workout Plan</h1>
    <p>2S Full-Body</p>
  </div>
  <div class="header-right">
    <div id="sync" class="sync-dot">Sheets ready</div>
    <div id="session-timer" class="session-timer">⏱ <span id="timer-display">0:00</span></div>
  </div>
</header>

<!-- REST TIMER OVERLAY -->
<div id="rest-overlay" class="rest-timer-overlay">
  <div class="rest-timer-label">REST</div>
  <div id="rest-count" class="rest-timer-count">2:00</div>
  <div class="rest-timer-bar"><div id="rest-bar" class="rest-timer-progress" style="width:100%"></div></div>
  <button class="rest-timer-skip" onclick="skipRest()">tap to dismiss</button>
</div>

<!-- TRACKER (only view) -->
<div class="page">
  <div class="section-label">Log session</div>
  <div class="card">
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <div class="tracker-daylabel">Full Body</div>
      <input type="date" id="sdate" style="flex:1;border:0.5px solid #ddd;border-radius:8px;padding:8px 10px;font-size:13px;">
    </div>
    <div id="tfields"></div>
    <div class="section-label">
      <div class="notes-label">Overall session note <span class="notes-optional">(optional)</span></div>
    </div>
    <textarea id="snotes" class="notes-area" placeholder="Overall vibe — energy 1-10, sleep, protein yesterday, anything that affected the whole session."></textarea>
    <button class="save-btn" id="savebtn" onclick="saveSession()">Save session to Google Sheets</button>
  </div>
  <div class="section-label">Session history</div>
  <div id="hlist"><div style="text-align:center;padding:1.5rem;font-size:13px;color:#888;">Loading from Sheets...</div></div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz6inZ8RaDNrfpFekaHPMz_B7n6Ao0rEuGOOBDUpzbLoAqcTFI39Fa-4io8azEkM191/exec';

// Exercise definitions — 2S Full-Body template
// restSecs: 120 on heavy compounds (paired, so rest fills productively), 60-90 on lighter work
// timeBased: true = seconds input instead of reps
// variants: alternative exercise names (rotate across Mon/Wed/Fri)
// Order follows the gym floor: own the rack for all four barbell lifts
// (squat, bench, RDL, OHP), then migrate once to the cable station (row,
// pulldown), then finish with Block D. Still alternates muscle groups.
const FULLBODY = [
  { id:'squat',  name:'Back squat',            sets:2, target:'6–10',  hasWeight:true,  restSecs:120, timeBased:false,
    variants:['Back squat','Leg press','Hack squat','Goblet squat','Bulgarian split squat'] },
  { id:'hpush',  name:'Barbell bench press',   sets:2, target:'6–10',  hasWeight:true,  restSecs:120, timeBased:false,
    variants:['Barbell bench press','Dumbbell bench press','Machine chest press','Incline DB press'] },
  { id:'hinge',  name:'Romanian deadlift',     sets:2, target:'8–10',  hasWeight:true,  restSecs:120, timeBased:false,
    variants:['Romanian deadlift','Dumbbell RDL','Trap bar deadlift','Hip thrust'] },
  { id:'vpush',  name:'Barbell OHP',           sets:2, target:'8–10',  hasWeight:true,  restSecs:120, timeBased:false,
    variants:['Barbell OHP','Dumbbell shoulder press','Machine shoulder press','Arnold press'] },
  { id:'row',    name:'Seated cable row',      sets:2, target:'8–10',  hasWeight:true,  restSecs:90,  timeBased:false,
    variants:['Seated cable row','Barbell bent-over row','Chest-supported row','Machine row','Dumbbell row'] },
  { id:'vpull',  name:'Lat pulldown',          sets:2, target:'8–12',  hasWeight:true,  restSecs:90,  timeBased:false,
    variants:['Lat pulldown','Lat pulldown (neutral)','Assisted pull-up','Cable pullover'] },
  { id:'lateral',name:'Lateral raise',         sets:2, target:'12–15', hasWeight:true,  restSecs:60,  timeBased:false,
    variants:['Lateral raise','Cable lateral raise','Machine lateral raise'] },
  { id:'facepull',name:'Face pull',            sets:2, target:'15–20', hasWeight:true,  restSecs:60,  timeBased:false,
    variants:['Face pull','Band face pull','Reverse pec deck'] },
  { id:'arms',   name:'Curl + pushdown superset', sets:2, target:'10–12', hasWeight:true, restSecs:60, timeBased:false,
    variants:['Curl + pushdown superset','DB curl + rope pushdown','Hammer curl + overhead extension','Preacher curl + skull crusher'] },
  { id:'core',   name:'Hanging knee raise',    sets:2, target:'12–15', hasWeight:false, restSecs:60,  timeBased:false,
    variants:['Hanging knee raise','Captain\'s chair raise','Cable crunch','Ab wheel rollout'] },
];
const SESSION_LABEL = 'Full Body';

// State
let localHistory = [];
let lastSessionData = {}; // keyed by exercise/variant NAME
let restTimer = null;
let restRemaining = 0;
let restTotal = 0;
let sessionStartTime = null;
let sessionTimerInterval = null;
let warmupCounts = {};
const activeExTimers = {};

function restLabel(s) {
  if (s % 60 === 0) return `${s/60} min rest`;
  return `${s}s rest`;
}

// ── Session duration timer ──────────────────────────────────────
function startSessionTimer() {
  if (sessionStartTime) return;
  sessionStartTime = Date.now();
  const timerEl = document.getElementById('session-timer');
  const displayEl = document.getElementById('timer-display');
  timerEl.classList.add('active');
  sessionTimerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    displayEl.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

// ── Rest timer ──────────────────────────────────────────────────
function startRestTimer(seconds) {
  if (restTimer) clearInterval(restTimer);
  restRemaining = seconds;
  restTotal = seconds;
  const overlay = document.getElementById('rest-overlay');
  const countEl = document.getElementById('rest-count');
  const barEl = document.getElementById('rest-bar');
  overlay.classList.add('active');
  updateRestDisplay(countEl, barEl);
  restTimer = setInterval(() => {
    restRemaining--;
    updateRestDisplay(countEl, barEl);
    if (restRemaining <= 0) {
      clearInterval(restTimer);
      restTimer = null;
      countEl.textContent = 'GO!';
      countEl.classList.add('urgent');
      barEl.style.width = '0%';
      setTimeout(() => {
        overlay.classList.remove('active');
        countEl.classList.remove('urgent');
      }, 1500);
    }
  }, 1000);
}

function updateRestDisplay(countEl, barEl) {
  const m = Math.floor(restRemaining / 60);
  const s = restRemaining % 60;
  countEl.textContent = restRemaining <= 10
    ? restRemaining.toString()
    : `${m}:${s.toString().padStart(2,'0')}`;
  if (restRemaining <= 10) countEl.classList.add('urgent');
  else countEl.classList.remove('urgent');
  barEl.style.width = `${(restRemaining / restTotal) * 100}%`;
}

function skipRest() {
  if (restTimer) { clearInterval(restTimer); restTimer = null; }
  document.getElementById('rest-overlay').classList.remove('active');
}

// ── Render tracker ──────────────────────────────────────────────
function renderTracker() {
  const c = document.getElementById('tfields');
  c.innerHTML = '';
  warmupCounts = {};

  FULLBODY.forEach(ex => {
    warmupCounts[ex.id] = 0;
    const b = document.createElement('div');
    b.className = 'set-block';
    b.id = `block-${ex.id}`;

    const lastData = lastSessionData[ex.name];
    const lastHtml = lastData
      ? `<div class="last-session" id="last-${ex.id}">Last: ${lastData}</div>`
      : `<div class="last-session loading" id="last-${ex.id}">Loading previous...</div>`;

    let variantHtml = '';
    if (ex.variants && ex.variants.length > 1) {
      variantHtml = `<select class="ex-variant-select" id="variant-${ex.id}" onchange="onVariantChange('${ex.id}')">
        ${ex.variants.map(v => `<option value="${v}"${v===ex.name?' selected':''}>${v===ex.name?'★ '+v+' (anchor)':v}</option>`).join('')}
      </select>`;
    }

    const quickFillHtml = (lastData && ex.hasWeight)
      ? `<button class="quick-fill-btn visible" id="qfbtn-${ex.id}" onclick="quickFill('${ex.id}')" title="Fill with last session weights">↩ Same as last</button>`
      : `<button class="quick-fill-btn" id="qfbtn-${ex.id}" onclick="quickFill('${ex.id}')">↩ Same as last</button>`;

    let setsHtml = `<div id="sets-container-${ex.id}">`;
    for (let i = 1; i <= ex.sets; i++) {
      setsHtml += buildSetRow(ex, i, false);
    }
    setsHtml += '</div>';

    const warmupBtnHtml = `<button class="add-warmup-btn" onclick="addWarmup('${ex.id}')">+ add warm-up set</button>`;
    const exNoteHtml = `<textarea class="ex-note-input" id="en-${ex.id}" placeholder="Notes on this exercise (optional)" rows="1"></textarea>`;

    b.innerHTML = `
      <div class="set-block-header">
        <div>
          <div class="sbt">${ex.name}</div>
          <div class="sbs">${ex.sets} sets · ${ex.target} · ${restLabel(ex.restSecs)}</div>
        </div>
        ${quickFillHtml}
      </div>
      ${lastHtml}
      ${variantHtml}
      ${warmupBtnHtml}
      ${setsHtml}
      ${exNoteHtml}`;
    c.appendChild(b);
  });
}

function buildSetRow(ex, setNum, isWarmup) {
  const id = ex.id;
  const rowId = isWarmup ? `sr-${id}-wu-${setNum}` : `sr-${id}-${setNum}`;
  const wId = isWarmup ? `w-${id}-wu-${setNum}` : `w-${id}-${setNum}`;
  const rId = isWarmup ? `r-${id}-wu-${setNum}` : `r-${id}-${setNum}`;
  const timerId = isWarmup ? `t-${id}-wu-${setNum}` : `t-${id}-${setNum}`;
  const label = isWarmup ? `WU ${setNum}` : `Set ${setNum}`;
  const warmupClass = isWarmup ? ' warmup-row' : '';
  const repSection = ex.timeBased
    ? `<input type="tel" id="${rId}" class="set-ri" placeholder="sec"><button class="timer-btn" id="${timerId}" onclick="toggleExTimer('${rId}','${timerId}')">▶ Start</button>`
    : `<input type="tel" id="${rId}" class="set-ri" placeholder="reps"><span class="set-tgt">${ex.target}</span>`;

  return `<div class="set-row${warmupClass}" id="${rowId}">
    <span class="set-num">${label}</span>
    ${ex.hasWeight ? `<input type="tel" id="${wId}" class="set-wi" placeholder="lbs">
    <span class="set-unit">lbs</span>
    <span class="set-x">×</span>` : ''}
    ${repSection}
    <div class="set-check" onclick="toggleSet('${id}',${setNum},${isWarmup},${ex.restSecs})">✓</div>
  </div>`;
}

function addWarmup(exId) {
  warmupCounts[exId] = (warmupCounts[exId] || 0) + 1;
  const num = warmupCounts[exId];
  const ex = FULLBODY.find(e => e.id === exId);
  const container = document.getElementById(`sets-container-${exId}`);
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = buildSetRow(ex, num, true);
  container.insertBefore(tempDiv.firstElementChild, container.firstChild);
  startSessionTimer();
}

function toggleSet(id, i, isWarmup, restSecs) {
  const rowId = isWarmup ? `sr-${id}-wu-${i}` : `sr-${id}-${i}`;
  const row = document.getElementById(rowId);
  const wasDone = row.classList.contains('done');
  row.classList.toggle('done');
  if (!wasDone && !isWarmup) {
    startSessionTimer();
    startRestTimer(restSecs);
  }
}

// Refresh the "Last:" line + quick-fill for the currently selected variant
function onVariantChange(exId) {
  const sel = document.getElementById(`variant-${exId}`);
  if (!sel) return;
  const name = sel.value;
  const last = lastSessionData[name];
  const el = document.getElementById(`last-${exId}`);
  const qf = document.getElementById(`qfbtn-${exId}`);
  const ex = FULLBODY.find(e => e.id === exId);
  if (last) {
    el.textContent = `Last: ${last}`;
    el.classList.remove('loading', 'none');
    if (qf && ex.hasWeight) qf.classList.add('visible');
  } else {
    el.textContent = 'No history for this variant yet';
    el.classList.remove('loading');
    el.classList.add('none');
    if (qf) qf.classList.remove('visible');
  }
}

function quickFill(exId) {
  const ex = FULLBODY.find(e => e.id === exId);
  if (!ex || !ex.hasWeight) return;
  const sel = document.getElementById(`variant-${exId}`);
  const name = sel ? sel.value : ex.name;
  const lastData = lastSessionData[name];
  if (!lastData) return;
  const parts = lastData.split(' / ');
  parts.forEach((part, idx) => {
    const match = part.match(/(\d+)lbs/);
    if (match) {
      const wEl = document.getElementById(`w-${exId}-${idx+1}`);
      if (wEl) wEl.value = match[1];
    }
  });
}

// ── Save session ────────────────────────────────────────────────
async function saveSession() {
  const btn = document.getElementById('savebtn');
  const date = document.getElementById('sdate').value;
  const sessionNote = document.getElementById('snotes').value.trim();
  const label = SESSION_LABEL;
  const ts = new Date().toLocaleString();

  btn.disabled = true;
  btn.textContent = 'Saving...';
  setSyncStatus('saving', 'Saving...');

  const rows = [];
  let isFirstRowOfSession = true;

  FULLBODY.forEach(ex => {
    const variantEl = document.getElementById(`variant-${ex.id}`);
    const exerciseName = variantEl ? variantEl.value : ex.name;

    const exNoteEl = document.getElementById(`en-${ex.id}`);
    const exNote = exNoteEl ? exNoteEl.value.trim() : '';

    const wuCount = warmupCounts[ex.id] || 0;
    for (let w = 1; w <= wuCount; w++) {
      const wEl = document.getElementById(`w-${ex.id}-wu-${w}`);
      const weight = wEl ? (wEl.value || 'BW') : 'BW';
      const reps = document.getElementById(`r-${ex.id}-wu-${w}`)?.value || '';
      rows.push([ts, date, label, exerciseName, 'Warm-up', weight, reps, 'WU', '']);
    }

    for (let i = 1; i <= ex.sets; i++) {
      const wEl = document.getElementById(`w-${ex.id}-${i}`);
      const weight = wEl ? (wEl.value || 'BW') : 'BW';
      const reps = document.getElementById(`r-${ex.id}-${i}`)?.value || '';
      const done = document.getElementById(`sr-${ex.id}-${i}`)?.classList.contains('done') ? 'Yes' : 'No';

      let noteCell = '';
      if (i === 1) {
        const parts = [];
        if (isFirstRowOfSession && sessionNote) parts.push(`[Session] ${sessionNote}`);
        if (exNote) parts.push(exNote);
        noteCell = parts.join(' | ');
        if (isFirstRowOfSession) isFirstRowOfSession = false;
      }

      rows.push([ts, date, label, exerciseName, `Set ${i}`, weight, reps, done, noteCell]);
    }
  });

  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({rows})
    });
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message || 'Script error');

    setSyncStatus('saved', 'Saved!');
    btn.textContent = 'Saved!';
    btn.style.background = '#1D9E75';

    const liftSummary = FULLBODY.map(ex => {
      const variantEl = document.getElementById(`variant-${ex.id}`);
      const exName = variantEl ? variantEl.value : ex.name;
      const exNoteEl = document.getElementById(`en-${ex.id}`);
      const exNote = exNoteEl ? exNoteEl.value.trim() : '';
      const setDetails = [];
      for (let i = 1; i <= ex.sets; i++) {
        const w = document.getElementById(`w-${ex.id}-${i}`)?.value;
        const r = document.getElementById(`r-${ex.id}-${i}`)?.value;
        if (w || r) setDetails.push(`${w ? w+(ex.timeBased?'s':'lbs') : 'BW'}×${r||'?'}`);
      }
      if (!setDetails.length) return null;
      const base = `${exName}: ${setDetails.join(' / ')}`;
      return exNote ? `${base} — ${exNote}` : base;
    }).filter(Boolean);

    localHistory.unshift({date, label, lifts: liftSummary, sessionNote});
    renderHistory();
    document.getElementById('snotes').value = '';

    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = 'Save session to Google Sheets';
      btn.style.background = '#1F3864';
      setSyncStatus('', 'Sheets ready');
    }, 3000);

  } catch(e) {
    setSyncStatus('error', 'Save failed');
    btn.disabled = false;
    btn.textContent = 'Retry save';
    console.error(e);
    alert('Save failed. Error: ' + e.message);
  }
}

// ── Load history + last session data ───────────────────────────
async function loadHistory() {
  try {
    const res = await fetch(SCRIPT_URL);
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message);
    const rows = data.data || [];
    if (rows.length <= 1) {
      document.getElementById('hlist').innerHTML = '<div style="text-align:center;padding:1.5rem;font-size:13px;color:#888;">No sessions logged yet.</div>';
      return;
    }

    const allRows = rows.slice(1);
    const lastByName = {};

    allRows.forEach(r => {
      if (r[4] === 'Warm-up') return;
      const name = r[3];
      const date = r[1];
      if (!lastByName[name] || date > lastByName[name].date) {
        lastByName[name] = { date, sets: [] };
      }
      if (date === lastByName[name].date) {
        const matched = FULLBODY.find(e => (e.variants ? e.variants.includes(name) : e.name === name));
        const unit = (matched && matched.timeBased) ? 's' : 'lbs';
        const weight = r[5];
        const reps = r[6];
        lastByName[name].sets.push(`${weight !== 'BW' ? weight+unit : 'BW'}×${reps}`);
      }
    });

    Object.entries(lastByName).forEach(([name, val]) => {
      lastSessionData[name] = val.sets.join(' / ');
    });

    FULLBODY.forEach(ex => {
      if (document.getElementById(`last-${ex.id}`)) onVariantChange(ex.id);
    });

    // Group rows into sessions for history display
    const grouped = {};
    allRows.forEach(r => {
      if (r[4] === 'Warm-up') return;
      const k = `${r[1]}_${r[2]}`;
      if (!grouped[k]) grouped[k] = { date:r[1], label:r[2], byExercise:{}, sessionNote:'', exNotes:{} };
      const ex = r[3];
      const noteCell = r[8] || '';

      if (noteCell) {
        const parts = noteCell.split(' | ');
        parts.forEach(part => {
          if (part.startsWith('[Session] ')) {
            grouped[k].sessionNote = part.replace('[Session] ', '');
          } else {
            grouped[k].exNotes[ex] = part;
          }
        });
      }

      if (!grouped[k].byExercise[ex]) grouped[k].byExercise[ex] = [];
      const weight = r[5]; const reps = r[6];
      grouped[k].byExercise[ex].push(`${weight!=='BW'?weight+'lbs':'BW'}×${reps}`);
    });

    localHistory = Object.values(grouped).reverse().map(s => ({
      ...s,
      lifts: Object.entries(s.byExercise).map(([ex, sets]) => {
        const base = `${ex}: ${sets.join(' / ')}`;
        return s.exNotes[ex] ? `${base} — ${s.exNotes[ex]}` : base;
      })
    }));

    renderHistory();
  } catch(e) {
    document.getElementById('hlist').innerHTML = '<div style="text-align:center;padding:1.5rem;font-size:13px;color:#888;">Could not load history.</div>';
    console.error(e);
  }
}

function renderHistory() {
  const el = document.getElementById('hlist');
  if (!localHistory.length) {
    el.innerHTML = '<div style="text-align:center;padding:1.5rem;font-size:13px;color:#888;">No sessions yet.</div>';
    return;
  }
  el.innerHTML = localHistory.slice(0, 5).map(s => `
    <div class="he">
      <div class="hh">
        <div class="ht" style="color:#1F3864">${s.label}</div>
        <div class="hd">${s.date}</div>
      </div>
      <div class="hl">${s.lifts.join('<br>')}</div>
      ${s.sessionNote ? `<div class="hn">${s.sessionNote}</div>` : ''}
    </div>`).join('');
}

function setSyncStatus(state, text) {
  const el = document.getElementById('sync');
  el.className = 'sync-dot ' + (state || '');
  el.textContent = text;
}

// ── Exercise set timer (time-based moves) ───────────────────────
function toggleExTimer(inputId, btnId) {
  const btn = document.getElementById(btnId);
  const input = document.getElementById(inputId);
  if (activeExTimers[inputId]) {
    clearInterval(activeExTimers[inputId]);
    delete activeExTimers[inputId];
    btn.textContent = '▶ Start';
    btn.classList.remove('timer-running');
  } else {
    let secs = parseInt(input.value) || 0;
    input.value = secs;
    btn.textContent = '⏹ Stop';
    btn.classList.add('timer-running');
    startSessionTimer();
    activeExTimers[inputId] = setInterval(() => {
      secs++;
      input.value = secs;
    }, 1000);
  }
}

// Init — tracker is the only view, so render + load immediately
document.getElementById('sdate').valueAsDate = new Date();
renderTracker();
loadHistory();
</script>
